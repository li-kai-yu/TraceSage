server:
  port: 8081

spring:
  application:
    name: tracesage-system
  config:
    import:
      - optional:nacos:tracesage-system.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/tracesage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 50

  elasticsearch:
    uris: http://${ES_HOST:127.0.0.1}:9200

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.tracesage.system.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true

tracesage:
  jwt:
    header: Authorization
    prefix: "Bearer "
    secret: ${JWT_SECRET:tracesage-default-secret-please-change-in-production}
    # 令牌有效期，单位秒
    expire-seconds: 7200

management:
  endpoints:
    web:
      exposure:
        include: health,info
